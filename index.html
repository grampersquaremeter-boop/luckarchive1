
<!DOCTYPE html>
<html lang="ko" class="dark">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUCK ARCHIVE - 정밀 데이터 분석</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
    <link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" />
    <script>
        window.tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#13e76b",
                        "background-light": "#f6f8f7",
                        "background-dark": "#000000",
                        "glass-border": "rgba(255, 255, 255, 0.1)",
                        "glass-bg": "rgba(16, 34, 24, 0.7)",
                    },
                    fontFamily: {
                        "display": ["Pretendard Variable", "Pretendard", "sans-serif"],
                        "sans": ["Pretendard Variable", "Pretendard", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Pretendard Variable', 'Pretendard', sans-serif;
            background-color: #000000;
            color: #ffffff;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.03);
            backdrop-filter: blur(60px);
            -webkit-backdrop-filter: blur(60px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.05), 0 20px 50px rgba(0, 0, 0, 0.3);
        }
        .glass-3d-button-primary {
            background: linear-gradient(135deg, #13e76b, #0da34d);
            border: 1px solid rgba(255, 255, 255, 0.4);
            box-shadow: 
                inset 0 2px 4px rgba(255, 255, 255, 0.6), 
                0 12px 30px rgba(19, 231, 107, 0.4), 
                inset 0 -4px 8px rgba(0, 0, 0, 0.4), 
                inset 0 0 15px rgba(255, 255, 255, 0.2);
            position: relative;
            overflow: hidden;
        }
        .glass-3d-button-primary::after {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; height: 45%;
            background: linear-gradient(to bottom, rgba(255, 255, 255, 0.45), rgba(255, 255, 255, 0.1) 80%, transparent);
            pointer-events: none;
        }
        .scanning-line {
            height: 1px;
            background: linear-gradient(90deg, transparent, rgba(19, 231, 107, 0.5), transparent);
            box-shadow: 0 0 20px rgba(19, 231, 107, 0.3);
            position: absolute;
            width: 100%;
            top: 50%;
            left: 0;
            opacity: 0.4;
            animation: scan 3s linear infinite;
        }
        @keyframes scan {
            0% { top: 0%; }
            100% { top: 100%; }
        }
        .custom-scrollbar::-webkit-scrollbar { width: 4px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(19, 231, 107, 0.2); border-radius: 10px; }
    </style>
<script type="importmap">
{
  "imports": {
    "react-router-dom": "https://esm.sh/react-router-dom@^7.13.0",
    "recharts": "https://esm.sh/recharts@^3.7.0",
    "react/": "https://esm.sh/react@^19.2.4/",
    "react": "https://esm.sh/react@^19.2.4",
    "react-dom/": "https://esm.sh/react-dom@^19.2.4/",
    "@google/genai": "https://esm.sh/@google/genai@^1.41.0"
  }
}
</script>
</head>
<body class="bg-black text-white">
    <div id="root"></div>
</body>
</html>
